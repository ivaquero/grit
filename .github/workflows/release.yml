name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# 同一个 tag 不并发发布；后到的排队而不是取消，避免半成品 release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  goreleaser:
    name: goreleaser
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # 编译、归档、校验和、changelog、创建 GitHub Release，全部由 .goreleaser.yaml 声明。
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Scoop manifest 由 checksums 反推，随 release 一起分发；
      # 想进 bucket 时把 grit.json 拷进 scoop bucket 的 bucket/ 目录即可。
      - name: Generate Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          zip="grit_${version}_windows_amd64.zip"
          sha=$(grep -F "  ${zip}" dist/sha256sums.txt | cut -d' ' -f1)
          if [ -z "$sha" ]; then
            echo "no checksum for ${zip}" >&2
            exit 1
          fi

          cat > dist/grit.json <<EOF
          {
            "version": "${version}",
            "description": "Declarative shell and dotfile environment manager",
            "homepage": "https://github.com/${REPO}",
            "license": "GPL-3.0-or-later",
            "architecture": {
              "64bit": {
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${zip}",
                "hash": "${sha}"
              }
            },
            "bin": "grit.exe",
            "checkver": {
              "github": "https://github.com/${REPO}"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/${REPO}/releases/download/v\$version/grit_\$version_windows_amd64.zip"
                }
              }
            }
          }
          EOF
          cat dist/grit.json
          gh release upload "$TAG" dist/grit.json --clobber

      - name: Keep archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grit-${{ github.ref_name }}
          path: dist/
          retention-days: 14
