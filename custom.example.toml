# 用户配置模板：复制为 custom.toml 后按需修改。
# 这是唯一的用户级配置格式，不再读取 custom.json。

# 备份根目录。相对路径基于用户主目录。
oxide_folder = "~/Documents/GitHub/backup"
# Windows 专用覆盖。留空则回退到 oxide_folder。
oxide_folder_win = ""

# 备份路径表：key = bk + <ELEMENT key>，value 相对 oxide_folder。
[oxides]
bkzs = "shell/.zshrc"
bkbs = "shell/.bash_profile"
bkps = "shell/Profile.ps1"
bkg = "shell/.gitconfig"
bkvi = "shell/.vimrc"
bkwz = "unix/wezterm.lua"
bkss = "projects/starship.toml"

# 代理端口别名：pxy c 等价于 pxy 7890。
[proxy_ports]
c = 7890
m = 7898
v = 1080

# Julia 环境别名：把短名映射到环境目录，jleat / jeq 会展开。
# 注意：conda 的 ceat 直接用 conda 原生环境名（如 ceat kaggle），不经 grit 展开，
# 因此没有 env.conda 这张表。
[env.julia]
t = "Documents/GitHub/blog-julia/pluto-deployment-environment"

# Windows 专用覆盖，与 oxide_folder_win 同一套约定。
[env.julia_win]
t = "D:/GitHub/blog-julia/pluto-deployment-environment"
