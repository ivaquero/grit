name = "apt"
abbr = "a"
requires = "apt"
os = "linux"

[actions]
h = "apt --help"
is = "sudo apt install {0}"
us = "sudo apt remove {0}"
up = "sudo apt upgrade {0}"
ups = "sudo apt update"
ls = "apt list --installed"
sc = "apt search {0}"
cl = "sudo apt autoremove"
ck = "sudo apt check"
dp = "apt depends {0}"
xa = "sudo add-apt-repository {0}"
xrm = "sudo add-apt-repository --remove {0}"
xls = "apt policy"
