name = "winget"
abbr = "w"
requires = "winget"
os = "windows"

[actions]
h = "winget --help"
is = "winget install {0}"
us = "winget uninstall {0}"
up = "winget upgrade {0}"
ls = "winget list {0}"
st = "winget list --upgrade-available"
sc = "winget search {0}"
if = "winget show {0}"
ifs = "winget --info"
cf = "winget settings"
xa = "winget source add {0}"
xrm = "winget source remove {0}"
xls = "winget source list"
