# Julia：纯转发走 jl 前缀（静态模板），需要计算的动作走 [run]，
# 改变当前 shell 的环境激活走 state 通道。
#
# [run] 的 key 是完整命令名，不走 abbr 拼接 —— 与 [state] 同一套口径。
# 环境短名来自 custom.toml 的 [env.julia] / [env.julia_win]，
# 也可以直接给路径（相对路径基于主目录）或 @name。
name = "julia"
abbr = "jl"
requires = "julia"

# 模板能完整表达的动作，保持纯转发。
[actions]
h = "julia --help"
v = "julia --version"
r = "julia --eval {0}"

# 这些动作走 `grit run julia <key>`：
# 包名列表要渲染成 Julia 数组字面量，静态模板做不到。
[run]
jlis = { runner = "julia", op = "add" }
jlus = { runner = "julia", op = "rm" }
jlup = { runner = "julia", op = "update" }
jlpn = { runner = "julia", op = "pin" }
jlpnr = { runner = "julia", op = "free" }
jlb = { runner = "julia", op = "build" }
jlts = { runner = "julia", op = "test" }
jlst = { runner = "julia", op = "status" }
jlcl = { runner = "julia", op = "gc" }
jllv = { runner = "julia", op = "leaves" }
jlmt = { runner = "julia", op = "maturity" }
jlenvs = { runner = "julia", op = "envs" }
jlcur = { runner = "julia", op = "current" }

# state = true：执行器只打印 shell 代码，必须由父 shell eval。
# JULIA_PROJECT 由 Julia 自己认，包操作因此不必带 --project=。
jleat = { runner = "julia", op = "activate", state = true }
jeq = { runner = "julia", op = "deactivate", state = true }
